name: Platform ACE Apply

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

env:
  # Keep in step with plan.yml and build.yml.
  TF_VERSION: 1.16.5

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.environment }}
          path: plan

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly -reconfigure -backend-config=environments/${{ inputs.environment }}.backend.hcl

      # A saved plan is refused if the environment's state has changed since it
      # was made, so a stale plan fails here rather than applying.
      - name: Terraform Apply
        run: terraform apply -input=false -parallelism=1 plan/tfplan
